openapi: "3.1.1"
info:
  version: 1.0.0
  title: cdextract server API
  summary: cdextract server API
  description: "This API controls cdextract, a tool for CD audio extraction"
  termsOfService: "/terms/"
  contact:
    name: cdextract support
    url: https://github.com/Lnxzz/cdextract
    email: cdextract@heerschop.frl 
  license:
    name: GNU Lesser General Public License version 3
    url: https://www.gnu.org/licenses/lgpl-3.0.en.html
servers:
  - url: http://{host}:{port}/{version}
    description: The API Server base path
    variables:
      host:
        default: localhost
      port:
        default: "8001"
      version:
        enum:
          - "v1"
        default: "v1"
paths:
  /drive:
    get:
      summary: "Information of the connected cdrom drive."
      operationId: get_drive_info
      tags:
        - drive
      responses:
        200:
          description: "Expected response to a valid request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/drive"
        404:
          description: "Not Found. No drive has been found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        503:
          description: "Service Unavailable. The server is not ready to handle the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        default:
          description: "Unexpected Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
    post:
      summary: "Open the connection with cdrom drive."
      operationId: open_drive
      tags:
        - drive
      responses:
        200:
          description: "Expected response to a valid request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/drive"
        404:
          description: "Not Found. No drive has been found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        503:
          description: "Service Unavailable. The server is not ready to handle the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        default:
          description: "Unexpected Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
    delete:
      summary: "Close the connection with cdrom drive."
      operationId: close_drive
      tags:
        - drive
      responses:
        204:
          description: "No content. The request has succeeded."
        404:
          description: "Not Found. No drive has been found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        423:
          description: "Locked. Resource is locked."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        503:
          description: "Service Unavailable. The server is not ready to handle the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        default:
          description: "Unexpected Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
  /disc:
    get:
      summary: "Information of the disc in the cdrom drive."
      operationId: get_disc_info
      tags:
        - disc
      parameters:
        - name: overwrite
          in: query
          description: "Specifies whether to overwrite existing data (default 0)"
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 1
        - name: fuzzy
          in: query
          description: "Specifies whether to use a fuzzy disc look up method (default 0)"
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 1
      responses:
        200:
          description: "Expected response to a valid request. Returns the information of the current disc."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/disc"
        404:
          description: "Not Found. No disc has been found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        409:
          description: "Conflict. The request could not be processed because of conflict in the current state of the resource."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        500:
          description: "Internal Server Error. The server encountered an unexpected condition which prevented it from fulfilling the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"        
        503:
          description: "Service Unavailable. The server is not ready to handle the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        default:
          description: "Unexpected Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
    post:
      summary: "Edit the information of the disc in the cdrom drive."
      operationId: update_disc_info
      tags:
        - disc
      requestBody:
        description: "The updated disc information"
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/disc_body"
      responses:
        200:
          description: "Expected response to a valid request. Returns the updated information of the current disc."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/disc"
        404:
          description: "Not Found. No disc has been found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        503:
          description: "Service Unavailable. The server is not ready to handle the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        default:
          description: "Unexpected Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
    put:
      summary: "Insert a disc into the cdrom drive."
      operationId: insert_disc
      tags:
        - disc
      responses:
        204:
          description: "No content. The request has succeeded."
        default:
          description: "Unexpected Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        404:
          description: "Not Found. No disc has been found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        503:
          description: "Service Unavailable. The server is not ready to handle the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
    delete:
      summary: "Eject the disc from the cdrom drive."
      operationId: eject_disc
      tags:
        - disc
      responses:
        204:
          description: "No content. The request has succeeded."
        423:
          description: "Locked. Resource is locked."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        503:
          description: "Service Unavailable. The server is not ready to handle the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        default:
          description: "Unexpected Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
  /disc/extract:
    get:
      summary: "Get the audio extraction progress status."
      operationId: get_extract_disc_progress
      tags:
        - disc
      parameters:
        - name: stream
          in: query
          description: "indicator to get a streaming response instead of a single reply"
          required: false
          schema:
            type: integer
            format: int32
            minimum: -999
            maximum: 999
      responses:
        200:
          description: "Expected response to a valid request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/progress"
        404:
          description: "No drive and/or disc found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        503:
          description: "Service Unavailable. The server is not ready to handle the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        default:
          description: "Unexpected Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
    post:
      summary: Extract the audio from the disc in the cdrom drive
      operationId: extract_disc
      tags:
        - disc
      responses:
        200:
          description: "Expected response to a valid request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/progress"
        404:
          description: "No drive and/or disc found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        423:
          description: "Locked. Resource is locked."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        503:
          description: "Service Unavailable. The server is not ready to handle the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        default:
          description: "Unexpected Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
    delete:
      summary: Cancel the audio extraction from disc
      operationId: cancel_extract_disc
      tags:
        - disc
      responses:
        204:
          description: "No content. The request has succeeded."
        404:
          description: "No drive and/or disc found"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        423:
          description: "Locked. Resource is locked."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        503:
          description: "Service Unavailable. The server is not ready to handle the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        default:
          description: "Unexpected Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"    
  /disc/front:
    get:
      summary: "Get the front cover of the disc in the cdrom drive."
      operationId: get_disc_front_cover
      tags:
        - disc
      parameters:
        - name: default
          in: query
          description: "Specify whether a default cover image should be returned."
          required: false
          schema:
            type: boolean
      responses:
        200:
          description: "Expected response to a valid request."
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        404:
          description: "The requested front cover could not be found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        503:
          description: "Service Unavailable. The server is not ready to handle the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"   
        default:
          description: "Unexpected Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
    post:
      summary: "Update the front cover of the disc in the cdrom drive."
      operationId: update_disc_front_cover
      tags:
        - disc
      requestBody:
        description: "The updated front cover image"
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      responses:
        204:
          description: "No content. The request has succeeded."
        400:
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        503:
          description: "Service Unavailable. The server is not ready to handle the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"   
        default:
          description: "Unexpected Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
  /disc/back:
    get:
      summary: "Get the back cover of the disc in the cdrom drive."
      operationId: get_disc_back_cover
      tags:
        - disc
      parameters:
        - name: default
          in: query
          description: "Specify whether a default cover image should be returned."
          required: false
          schema:
            type: boolean
      responses:
        200:
          description: "Expected response to a valid request."
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        404:
          description: "The requested back cover could not be found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        503:
          description: "Service Unavailable. The server is not ready to handle the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        default:
          description: "Unexpected Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
    post:
      summary: "Update the back cover of the disc in the cdrom drive."
      operationId: update_disc_back_cover
      tags:
        - disc
      requestBody:
        description: "The updated back cover image"
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      responses:
        204:
          description: "No content. The request has succeeded."
        400:
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        503:
          description: "Service Unavailable. The server is not ready to handle the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"   
        default:
          description: "Unexpected Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
  /disc/audio:
    get:
      summary: "Get the audio data of the disc in the cdrom drive."
      operationId: get_audio
      tags:
        - disc
      parameters:
        - name: track
          in: query
          required: false
          description: "The track number for which to return the audio data. If not specified, the first track will be returned."
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 100
        - name: format
          in: query
          description: "Specify audio format of the track to retrieve (default flac)"
          required: false
          schema:
            type: string
            enum: [flac, wav, pcm]  
      responses:
        200:
          description: "Expected response to a valid request."
          content:
            audio/flac:
              schema:
                type: string
                format: binary
            audio/wav:
              schema:
                type: string
                format: binary
            audio/pcm:
              schema:
                type: string
                format: binary
        404:
          description: "The requested audio track could not be found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        503:
          description: "Service Unavailable. The server is not ready to handle the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        default:
          description: "Unexpected Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
  /discs:
    get:
      summary: "Get a list of stored discs"
      operationId: list_discs
      tags:
        - discs
      parameters:
        - name: limit
          in: query
          description: "The number of items to return at one time (max. 100)"
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
        - name: offset
          in: query
          description: "Where to start with returning items (default 0)"
          required: false
          schema:
            type: integer
            format: int32
            minimum: 0
        - name: format
          in: query
          description: "The format of the stored disc information list; discs=disc information, tracks=disc and track information (default disc information only)"
          required: false
          schema:
            type: string
            enum: [discs, tracks]  
      responses:
        200:
          description: "An paged array of discs."
          headers:
            x-next:
              description: the offset to the next page of responses
              schema:
                type: string
          content:
            application/json:    
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/disc"
        400:
          description: "Bad Request"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        503:
          description: "Service Unavailable. The server is not ready to handle the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        default:
          description: "Unexpected Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
  /discs/{discId}:
    get:
      summary: "Get the information of the specified stored disc."
      operationId: get_disc_by_id
      tags:
        - discs
      parameters:
        - name: discId
          in: path
          required: true
          description: The id of the disc to retrieve
          schema:
            type: string
      responses:
        200:
          description: "Expected response to a valid request. Returns the information of the specified disc."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/disc"
        404:
          description: "Not Found. No disc information has been found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        503:
          description: "Service Unavailable. The server is not ready to handle the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        default:
          description: "Unexpected Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
    post:
      summary: "Edit the information of the specified disc."
      operationId: update_disc_info_by_id
      tags:
        - discs
      requestBody:
        description: "The updated disc information."
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/disc_body"
      responses:
        200:
          description: "Expected response to a valid request. Returns the updated information of the current disc."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/disc"
        403:
          description: "Forbidden. The client is not allowed to update the disc information."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        404:
          description: "Not Found. No disc information has been found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        503:
          description: "Service Unavailable. The server is not ready to handle the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        default:
          description: "Unexpected Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
  /discs/{discId}/front:
    get:
      summary: "Get the front cover of the specified disc."
      operationId: get_disc_front_cover_by_id
      tags:
        - discs
      parameters:
        - name: discId
          in: path
          required: true
          description: "The id of the disc for which to retrieve the front cover."
          schema:
            type: string
        - name: default
          in: query
          description: "Specify whether a default cover image should be returned."
          required: false
          schema:
            type: boolean
      responses:
        200:
          description: "Expected response to a valid request."
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        404:
          description: "The requested front cover could not be found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        503:
          description: "Service Unavailable. The server is not ready to handle the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error" 
        default:
          description: "Unexpected Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
    post:
      summary: "Update the front cover of the specified disc in the database."
      operationId: update_disc_front_cover_by_id
      tags:
        - discs
      parameters:
        - name: discId
          in: path
          required: true
          description: "The id of the disc for which to update the front cover."
          schema:
            type: string
      requestBody:
        description: "The updated front cover image"
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      responses:
        204:
          description: "No content. The request has succeeded."
        423:
          description: "Locked. Resource is locked."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        503:
          description: "Service Unavailable. The server is not ready to handle the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"   
        default:
          description: "Unexpected Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
  /discs/{discId}/back:
    get:
      summary: "Get the back cover of the specified disc."
      operationId: get_disc_back_cover_by_id
      tags:
        - discs
      parameters:
        - name: discId
          in: path
          required: true
          description: "The id of the disc for which to retrieve the back cover."
          schema:
            type: string
        - name: default
          in: query
          description: "Specify whether a default cover image should be returned."
          required: false
          schema:
            type: boolean
      responses:
        200:
          description: "Expected response to a valid request."
          content:
            image/jpeg:
              schema:
                type: string
                format: binary
            image/png:
              schema:
                type: string
                format: binary
        404:
          description: "The requested back cover could not be found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        503:
          description: "Service Unavailable. The server is not ready to handle the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        default:
          description: "Unexpected Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
    post:
      summary: "Update the back cover of the specified disc in the database."
      operationId: update_disc_back_cover_by_id
      tags:
        - discs
      parameters:
        - in: path
          name: discId
          required: true
          description: "The id of the disc for which to update the back cover."
          schema:
            type: string
      requestBody:
        description: "The updated back cover image"
        required: true
        content:
          image/jpeg:
            schema:
              type: string
              format: binary
          image/png:
            schema:
              type: string
              format: binary
      responses:
        204:
          description: "No content. The request has succeeded."
        423:
          description: "Locked. Resource is locked."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        503:
          description: "Service Unavailable. The server is not ready to handle the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"   
        default:
          description: "Unexpected Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
  /discs/{discId}/audio:
    get:
      summary: "Get the audio data of the specified disc."
      operationId: get_audio_by_id
      tags:
        - discs
      parameters:
        - name: discId
          in: path
          required: true
          description: "The id of the disc for which to return audio data."
          schema:
            type: string
        - in: query
          name: track
          required: false
          description: "The track number for which to return the audio data. If not specified, the first track will be returned."
          schema:
            type: integer
            format: int32
            minimum: 0
            maximum: 100
        - name: format
          in: query
          description: "Specify audio format of the track to retrieve (default flac)"
          required: false
          schema:
            type: string
            enum: [flac, wav, pcm]  
      responses:
        200:
          description: "Expected response to a valid request."
          content:
            audio/flac:
              schema:
                type: string
                format: binary
            audio/wav:
              schema:
                type: string
                format: binary
            audio/pcm:
              schema:
                type: string
                format: binary
        404:
          description: "The requested audio track could not be found."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        503:
          description: "Service Unavailable. The server is not ready to handle the request."
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
        default:
          description: "Unexpected Error"
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/error"
  /discs/rescan:
    get:
      summary: "Get the discs database rescan status."
      operationId: rescan_status
      tags:
        - discs
      responses:
        200:
          description: "Expected response to a valid request. Returns the database rescan status."
          content:
            application/json:
