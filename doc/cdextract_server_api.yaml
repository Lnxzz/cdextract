components:
  schemas:
    drive:
      required:
        - device
        - status
      properties:
        device:
          description: "cdrom device"
          type: string
        status:
          description: "status of the cdrom device"
          type: integer
          format: int32
          minimum: -999
          maximum: 999
        root:
          description: "root folder for storing audio information"
          type: string
        folder:
          description: "folder currently used for storing audio information"
          type: string
        verbose:
          description: "verbose logging 0=off; 1=on"
          type: integer
          format: int32
          minimum: 0
          maximum: 1
        output_type:
          description: "audio output type 0=wav;1=flac"
          type: integer
          format: int32
          minimum: 0
          maximum: 1
        download_coverart:
          description: "download coverart 0=off; 1=on"
          type: integer
          format: int32
          minimum: 0
          maximum: 1
        search_drive:
          description: "automatically search for cdrom drive 0=off; 1=on"
          type: integer
          format: int32
          minimum: 0
          maximum: 1
        cd_speed:
          description: "cdrom drive speed"
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        max_retries:
          description: "maximum number of retries to read data"
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        abort_on_skip:
          description: "abort audio extraction when data could not be read; 0=off; 1=on"
          type: integer
          format: int32
          minimum: 0
          maximum: 1
        eject_when_done:
          description: "eject disc when audio extraction completed; 0=off; 1=on"
          type: integer
          format: int32
          minimum: 0
          maximum: 1
        write_json:
          description: "write disc information in json format; 0=off; 1=on"
          type: integer
          format: int32
          minimum: 0
          maximum: 1
        write_cue_sheet:
          description: "write disc information in cue sheet format; 0=off; 1=on"
          type: integer
          format: int32
          minimum: 0
          maximum: 1
        show_disc_info:
          description: "show gathered disc information; 0=off; 1=on"
          type: integer
          format: int32
          minimum: 0
          maximum: 1
        virtual_drive:
          description: "0=cdrom drive is a physical drive; 1=cdrom drive is a virtual drive"
          type: integer
          format: int32
          minimum: 0
          maximum: 1
        has_drive:
          description: "0=cdrom drive not found or available; 1=cdrom drive is available"
          type: integer
          format: int32
          minimum: 0
          maximum: 1
        opened:
          description: "0=cdrom drive connection not opened; 1=cdrom drive contains an audio disc and is opened"
          type: integer
          format: int32
          minimum: 0
          maximum: 1
    disc:
      required:
        - id
        - length
        - category
        - artist
        - title
      properties:
        id:
          description: "64-bit database identifier of the disc. Example: 1152. Contains 0 if the disc is not stored in the database."
          type: integer
          format: int64
        disc_id:
          description: "calculated cddb disc id from the track information read from the disc. Example: f50a3b13"
          type: string
          format: hex
          minLength: 8
          maxLength: 8
        lookup:
          description: "64-bit internal hash value of the disc information to enable fast lookups"
          type: string
          format: hex
          minLength: 16
          maxLength: 16
        length:
          description: "total length of the audio in frames"
          type: integer
          format: int32
        artist:
          description: "artist. Example: Various"
          type: string
        title:
          description: "title. Example: Various Live"
          type: string
        genre:
          description: "genre. Example: jazz"
          type: string
        year:
          description: "year. Example: 1994"
          type: string
        extended:
          description: "extended data"
          type: string
        cddb_query:
          description: "cddb query string. Example: f50a3b13+10+175+18469+34444+51154+70524+88841+104824+124686+140966+159454"
          type: string
        cddb_category:
          description: "cddb category. Example: jazz"
          type: string
        cddb_entry_id:
          description: "cddb entry id as returned by the query service and used to read a specific entry. Example: f50a3b14"
          type: string
          format: hex
          minLength: 8
          maxLength: 8 
        cddb_disc_id:
          description: "cddb disc id as returned by the cddb service. Example: f50a3b15"
          type: string
          format: hex
          minLength: 8
          maxLength: 8
        cddb_revision:
          description: "cddb revision number. Example: 1"
          type: integer
          format: int32          
        cddb_complete:
          description: "indicator stating cddb information gathering is complete; 1=complete"
          type: integer
          format: int32
        mb_query:
          description: "musicbrainz query string. Example: 10+175+18469+34444+51154+70524+88841+104824+124686+140966+159454+177668"
          type: string
        mb_fuzzy_lookup:
          description: "musicbrainz fuzzy TOC search. Example: 1+10+177668+175+18469+34444+51154+70524+88841+104824+124686+140966+159454"
          type: string
        mb_disc_id:
          description: "musicbrainz disc id. Example: BM0fleBGaH5TzPGp1jBh4s.VwpU-"
          type: string
        mb_release_id:
          description: "musicbrainz release id. Example: a0691875-152e-45a6-a30d-ab2b57c0648e"
          type: string
        mb_front_cover_size:
          description: "disc front cover image size"
          type: integer
          format: int32
        mb_back_cover_size:
          description: "disc back cover image size"
          type: integer
          format: int32
        mb_complete:
          description: "indicator stating musicbrainz data gathering is complete; 1=complete"
          type: integer
          format: int32
          minimum: 0
          maximum: 1
        extracted:
          description: "indicator stating the audio has been extracted from this disc"
          type: integer
          format: int32
          minimum: 0
          maximum: 1
        track_count:
          description: "number of tracks on the disc"
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        tracks:
          description: "the list of track details"
          type: array
          items:
            $ref: "#/components/schemas/track"
    disc_body:
      required:
        - id
        - length
      properties:
        id:
          description: "64-bit database identifier of the disc. Example: 1152. Contains 0 if the disc is not yet stored in the database."
          type: integer
          format: int64
        disc_id:
          description: "calculated cddb disc id from the track information read from the disc. Example: f50a3b13"
          type: string
          format: hex
          minLength: 8
          maxLength: 8
        artist:
          description: "artist. Example: Various"
          type: string
        title:
          description: "title. Example: Various Live"
          type: string
        genre:
          description: "genre. Example: jazz"
          type: string
        year:
          description: "year. Example: 1994"
          type: string
        extended:
          description: "extended data"
          type: string
        tracks:
          description: "the list of track details"
          type: array
          items:
            $ref: "#/components/schemas/track"
    track:
      required:
        - num
        - length
      properties:
        num:
          description: "track number"
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        length:
          description: "track length"
          type: integer
          format: int32
        title:
          description: "track title"
          type: string
        artist:
          description: "track artist"
          type: string
        album:
          description: "album the track belongs to"
          type: string
        genre:
          description: "genre"
          type: string
        year:
          description: "year"
          type: string
        extended:
          description: "extended track information"
          type: string
        filename:
          description: "track output filename. Note: ensure all the tracks of a disc are stored in the same folder"
          type: string
        skipped:
          description: "indicator stating the audio extraction for this track has been skipped"
          type: integer
          format: int32
          minimum: 0
          maximum: 1
    progress:
      description: "extraction status progress"
      required:
        - function
        - track_num
        - sector
        - percentage
        - message
      properties:
        function:
          description: "extract function. Examples: read, verify, write, end, #number"
          type: string
        track:
          description: "track number"
          type: integer
          format: int32
          minimum: 0
          maximum: 100
        sector:
          description: "sector being worked on"
          type: integer
        percentage:
          description: "percent completed"
          type: number
          format: float
          minimum: 0
          maximum: 100
        message:
          description: "status/error message"
          type: string
    status:
      description: "status message"
      required:
        - status
        - message
      properties:
        status:
          type: string
        message:
          type: string
    error:
      description: "error code and error message"
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
          minimum: -999
          maximum: 999
        message:
          type: string
